name: Release
# Pushing the tag created by `npm version` publishes a GitHub release whose notes are that
# version's CHANGELOG.md section.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The version was checked before it was tagged. Its built package is published first, since joined computers wait
      # for it to update; the checks run again after.
      - run: npm run build
      - run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
      - run: npm pack --ignore-scripts
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "agent-session-tower-${GITHUB_REF_NAME#v}.tgz"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
