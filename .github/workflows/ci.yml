name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  # The plan and the gate read earlier gate results and the merged pull request's record.
  checks: read
  actions: read
  pull-requests: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 2 }
      - id: plan
        name: Classify the change (quick, related, full or reused) and pick its lanes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-scope.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: ci-scope
          path: ci-scope.json
          if-no-files-found: error
          # A rerun of failed jobs replaces their earlier result instead of failing on the name.
          overwrite: true
  test:
    # Tower runs on macOS and on Linux; both are checked here, on GitHub's runners.
    name: ${{ matrix.os == 'macos-latest' && 'macOS' || 'Linux' }} ${{ matrix.node }} ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.lanes != '0'
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 40 || 20 }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - name: Install, build and prepare private fixture inputs
        run: node scripts/ci-run.mjs prepare '${{ matrix.id }}'
      - name: All assigned tests and runtime qualifications
        run: node scripts/ci-run.mjs test '${{ matrix.id }}'
      - name: Preserve actual result including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/ci-${{ matrix.id }}/receipt.json
            ${{ runner.temp }}/ci-${{ matrix.id }}/private-*/reports/
          if-no-files-found: error
          overwrite: true
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version: '26.0.0' }
      - run: node scripts/ci-run.mjs prepare checks
      - name: Typecheck, release identity and test integrity
        run: node scripts/ci-run.mjs checks checks
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-checks
          path: ${{ runner.temp }}/ci-checks/receipt.json
          if-no-files-found: error
          overwrite: true
  validation-gate:
    name: validation gate (all platforms)
    if: always()
    needs: [plan, test, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'ci-*', path: ci-results }
      - name: Recheck the tier and validate every selected lane's real result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-gate.mjs ci-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing
          path: ci-timing.json
          if-no-files-found: error
          overwrite: true
