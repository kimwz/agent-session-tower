name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: plan
        run: |
          node --input-type=module -e "import('./scripts/ci-plan.mjs').then(m=>console.log('matrix='+JSON.stringify({include:m.plan().filter(l=>l.os==='ubuntu-latest').map(({id,os,node,shard})=>({id,os,node,shard}))})))" >> "$GITHUB_OUTPUT"
      - name: Mark owner Mac and combined evidence as pending
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" -f state=pending -f context='macOS (owner Mac)' -f description='Awaiting exact-tree owner Mac results'
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" -f state=pending -f context='validation (all platforms)' -f description='Awaiting complete Mac and Linux results'
  test:
    name: Linux ${{ matrix.node }} shard ${{ matrix.shard }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }
      - name: Install, build and prepare private fixture inputs
        run: node scripts/ci-run.mjs prepare '${{ matrix.id }}'
      - name: All assigned tests and runtime qualifications
        run: node scripts/ci-run.mjs test '${{ matrix.id }}'
      - name: Preserve actual result including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/ci-${{ matrix.id }}/receipt.json
            ${{ runner.temp }}/ci-${{ matrix.id }}/private-*/reports/
          if-no-files-found: error
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version: '26.0.0' }
      - run: node scripts/ci-run.mjs prepare checks
      - name: Typecheck, release identity and test integrity
        run: node scripts/ci-run.mjs checks checks
      - uses: actions/setup-node@v7
        with: { node-version: '22.13.0' }
      - name: Actual unsupported legacy-loader verdict
        run: node scripts/ci-run.mjs legacy checks
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-checks
          path: ${{ runner.temp }}/ci-checks/receipt.json
          if-no-files-found: error
  validation-gate:
    name: Linux validation gate (Mac requires owner evidence)
    if: always()
    needs: [plan, test, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { pattern: 'ci-*', path: ci-results }
      - name: Validate Linux inventory, real results and whole test window
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs ci-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing
          path: ci-timing.json
          if-no-files-found: error
