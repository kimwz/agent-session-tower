name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Tower runs on macOS and on Linux; both check the same way.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22]
        include:
          # Quick lookups need SQLite's authorizer (Node.js 24.10+); 22 stays as the engines minimum.
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Linux servers often have no compiler: terminals then use node-pty's prebuilt twin, which is what is checked here.
      - if: runner.os == 'Linux'
        run: rm -rf node_modules/node-pty
      # Fails if this Node cannot run the lookup tests, so they are never silently skipped.
      - if: matrix.node == 24
        run: node --import tsx -e "import('./server/tower-tools/read-db.ts').then(m => { if (!m.lookupsSupported()) { console.error('no SQLite authorizer'); process.exit(1); } })"
      - name: Capture the pinned genuine old worker inputs
        shell: bash
        env:
          VALIDATION_ROOT: ${{ runner.temp }}/sqlite-general-old-fixtures
        run: |
          set -euo pipefail
          umask 077
          mkdir "$VALIDATION_ROOT"
          mkdir -p "$VALIDATION_ROOT"/{home,codex,claude,config,cache,state,data,runtime,tmp,reports}
          env -i PATH="$PATH" HOME="$VALIDATION_ROOT/home" \
            CODEX_HOME="$VALIDATION_ROOT/codex" CLAUDE_CONFIG_DIR="$VALIDATION_ROOT/claude" \
            XDG_CONFIG_HOME="$VALIDATION_ROOT/config" XDG_CACHE_HOME="$VALIDATION_ROOT/cache" \
            XDG_STATE_HOME="$VALIDATION_ROOT/state" XDG_DATA_HOME="$VALIDATION_ROOT/data" \
            XDG_RUNTIME_DIR="$VALIDATION_ROOT/runtime" TMPDIR="$VALIDATION_ROOT/tmp" \
            TMP="$VALIDATION_ROOT/tmp" TEMP="$VALIDATION_ROOT/tmp" \
            TOWER_AUTO_UPDATE=0 TSX_DISABLE_CACHE=1 NODE_DISABLE_COMPILE_CACHE=1 \
            SQLITE_VALIDATION_CI=1 VALIDATION_ROOT="$VALIDATION_ROOT" \
            TOWER_SQLITE_OLD122_ROOT="$VALIDATION_ROOT/old122" \
            TOWER_SQLITE_OLD124_ROOT="$VALIDATION_ROOT/old124" \
            /bin/bash --noprofile --norc <<'CAPTURE'
          set -euo pipefail
          node scripts/sqlite-old124-capture.mjs 1.122.0
          node scripts/sqlite-old124-capture.mjs 1.124.0
          CAPTURE
      - run: npm run check
        env:
          SQLITE_VALIDATION_CI: '1'
          VALIDATION_ROOT: ${{ runner.temp }}/sqlite-general-old-fixtures
          TOWER_SQLITE_OLD122_ROOT: ${{ runner.temp }}/sqlite-general-old-fixtures/old122
          TOWER_SQLITE_OLD124_ROOT: ${{ runner.temp }}/sqlite-general-old-fixtures/old124
  test-integrity:
    # Lists removed tests, new skips and changed assertions for the reviewer; fails only on a new unconditional skip.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --import tsx scripts/test-integrity.ts
