name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Tower runs on macOS and on Linux; both check the same way.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Linux servers often have no compiler: terminals then use node-pty's prebuilt twin, which is what is checked here.
      - if: runner.os == 'Linux'
        run: rm -rf node_modules/node-pty
      - run: npm run check
